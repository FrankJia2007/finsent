[project]
name = "finsent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "anthropic>=2.8.0",
    "datasets>=5.2.0",
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pandas-market-calendars>=5.6.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.3",
    "statsmodels>=0.15.0",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "transformers>=5.0",
    "yfinance>=1.8.0",
]

[project.scripts]
finsent = "finsent:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
]
